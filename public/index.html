<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>云卷云苏 · 情感导师 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #faf6f1;
    --card: #ffffff;
    --primary: #e88b8b;
    --primary-dark: #d4736f;
    --primary-light: #fce4e4;
    --male-color: #6b9fd4;
    --male-light: #e8f0fa;
    --female-color: #e88b8b;
    --female-light: #fce4e4;
    --text: #4a3f3a;
    --text-light: #8a7d77;
    --border: #f0e8e0;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ─── 顶部栏 ─── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--card);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .app-logo { font-size: 20px; }
  .app-name { font-size: 16px; font-weight: 700; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 8px; }

  /* 视角切换 */
  .identity-switch {
    display: flex; background: var(--bg); border-radius: 20px; padding: 3px; gap: 2px;
  }
  .identity-tab {
    padding: 6px 14px; border-radius: 18px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; color: var(--text-light);
    border: none; background: transparent;
  }
  .identity-tab.active.male { background: var(--male-color); color: #fff; }
  .identity-tab.active.female { background: var(--female-color); color: #fff; }

  /* ─── 建议墙 ─── */
  .advice-wall {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 8px;
  }
  .advice-empty {
    text-align: center; color: var(--text-light);
    padding: 40px 20px; font-size: 14px; line-height: 1.8;
  }
  .advice-empty .emoji { font-size: 40px; margin-bottom: 12px; }
  .advice-card {
    background: var(--card); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .advice-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .advice-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #f0a7a7);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff;
  }
  .advice-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .advice-time { font-size: 12px; color: var(--text-light); margin-left: auto; }

  .advice-section { margin-bottom: 14px; }
  .advice-section:last-child { margin-bottom: 0; }
  .advice-section-label {
    display: inline-block; font-size: 12px; font-weight: 600;
    margin-bottom: 6px; padding: 2px 8px; border-radius: 6px;
  }
  .advice-section-label.shared { color: var(--primary); background: var(--primary-light); }
  .advice-section-label.private { color: #5a8a5a; background: #e8f0e8; }
  .advice-shared-box {
    background: var(--bg); border-radius: 12px; padding: 14px;
    font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .advice-shared-box strong { font-weight: 600; color: var(--primary-dark); }
  .advice-private-box {
    background: #f0f5ef; border: 1px dashed #c0d4b0; border-radius: 12px; padding: 14px;
    font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .advice-private-box strong { font-weight: 600; color: #4a6a3a; }
  .advice-private-empty { font-size: 13px; color: var(--text-light); font-style: italic; }

  /* 思考动画 */
  .thinking-card {
    display: none; background: var(--card); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
    align-items: center; gap: 8px;
  }
  .thinking-card.show { display: flex; }
  .thinking-dots { display: flex; gap: 4px; }
  .thinking-dots span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
    animation: bounce 1.4s infinite ease-in-out;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  .thinking-text { font-size: 14px; color: var(--text-light); }

  /* ─── 倾诉区 ─── */
  .confession-area {
    flex-shrink: 0; background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .confession-label {
    font-size: 12px; color: var(--text-light); margin-bottom: 8px;
    display: flex; align-items: center; gap: 4px;
  }
  .confession-label .lock { font-size: 13px; }
  .confession-label .identity-tag {
    font-weight: 600; padding: 1px 6px; border-radius: 4px; font-size: 11px;
  }
  .confession-label .identity-tag.male { background: var(--male-light); color: var(--male-color); }
  .confession-label .identity-tag.female { background: var(--female-light); color: var(--female-color); }

  /* 选择卡片 */
  .option-group { margin-bottom: 10px; }
  .option-group-title { font-size: 13px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
  .option-list { display: flex; flex-direction: column; gap: 6px; }
  .option-card {
    padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: 12px;
    background: var(--bg); font-size: 14px; color: var(--text);
    cursor: pointer; transition: all 0.15s; line-height: 1.5;
  }
  .option-card.active.male { border-color: var(--male-color); background: var(--male-light); color: var(--male-color); }
  .option-card.active.female { border-color: var(--female-color); background: var(--female-light); color: var(--female-color); }
  .option-card:active { transform: scale(0.98); }

  /* 输入框 */
  .confess-input {
    width: 100%; min-height: 72px; max-height: 120px;
    padding: 10px 12px; border: 2px solid var(--border); border-radius: 12px;
    font-size: 15px; font-family: inherit; background: var(--bg); color: var(--text);
    resize: none; transition: border-color 0.2s; margin-bottom: 8px;
  }
  .confess-input:focus.male { border-color: var(--male-color); outline: none; }
  .confess-input:focus.female { border-color: var(--female-color); outline: none; }

  /* 倾诉历史 */
  .my-confessions { max-height: 100px; overflow-y: auto; margin-bottom: 8px; }
  .my-confession-item {
    font-size: 12px; color: var(--text-light);
    padding: 6px 10px; background: var(--bg); border-radius: 8px;
    margin-bottom: 4px; line-height: 1.5;
  }
  .my-confession-item .tags { color: var(--primary); margin-right: 6px; }
  .my-confession-item .text { color: var(--text); }

  /* 对方状态提示 */
  .other-status {
    font-size: 12px; color: var(--text-light); padding: 6px 10px;
    background: var(--bg); border-radius: 8px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .other-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; }
  .other-status .dot.active { background: #6bbf59; }

  /* 操作按钮 */
  .confess-actions { display: flex; gap: 8px; }
  .btn-confess {
    padding: 10px 16px; background: var(--card); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .btn-mentor {
    flex: 1; padding: 10px 16px;
    background: var(--primary); color: #fff; border: none;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-mentor:disabled { opacity: 0.5; }

  /* 引导语 */
  .guide-text {
    font-size: 13px; color: var(--text-light); line-height: 1.7;
    padding: 10px 12px; background: var(--bg); border-radius: 10px;
    margin-bottom: 10px;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff; padding: 10px 20px;
    border-radius: 20px; font-size: 14px; z-index: 200;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }

  /* 主容器 */
  #app {
    display: flex; flex-direction: column; height: 100vh;
  }
</style>
</head>
<body>

<div id="app">
  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="app-logo">☁️</span>
      <span class="app-name">云卷云苏</span>
    </div>
    <div class="topbar-right">
      <div class="identity-switch">
        <button class="identity-tab male active" onclick="switchIdentity('male')">👨 男生</button>
        <button class="identity-tab female" onclick="switchIdentity('female')">👩 女生</button>
      </div>
    </div>
  </div>

  <!-- 建议墙 -->
  <div class="advice-wall" id="adviceWall">
    <div class="advice-empty" id="adviceEmpty">
      <div class="emoji">🌱</div>
      <div id="emptyHint">在下方写下你想说的话，然后点「请导师回应」</div>
    </div>
    <div class="thinking-card" id="thinkingCard">
      <div class="thinking-dots"><span></span><span></span><span></span></div>
      <span class="thinking-text">导师正在认真听你们说…</span>
    </div>
  </div>

  <!-- 倾诉区 -->
  <div class="confession-area" id="confessionArea">
    <div id="confessionContent"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── 全局状态 ───
let myIdentity = 'male';
let pollTimer = null;
let renderedAdviceIds = new Set();
let renderedConfessionIds = new Set();

// 场景选项（通用，男女都用同一套）
const SCENE_OPTIONS = [
  { value: '我们最近在一次具体的事上有分歧', label: '我们最近在一次具体的事上有分歧' },
  { value: '我有些话想跟TA说但一直没找到机会', label: '我有些话想跟TA说但一直没找到机会' },
  { value: '我觉得TA最近有些变化，不太确定', label: '我觉得TA最近有些变化，不太确定' },
  { value: '我们好像还好，但有些东西在慢慢积累', label: '我们好像还好，但有些东西在慢慢积累' },
  { value: '其他', label: '其他' },
];

// ─── API 调用封装 ───
async function apiCall(path, body) {
  try {
    const resp = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return await resp.json();
  } catch (err) {
    return { ok: false, error: '网络请求失败：' + err.message };
  }
}

// ─── 切换视角 ───
function switchIdentity(id) {
  myIdentity = id;
  // 更新 tab 高亮
  document.querySelectorAll('.identity-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.identity-tab.${id}`).classList.add('active');
  // 清空已渲染记录，重新渲染
  renderedAdviceIds.clear();
  renderedConfessionIds.clear();
  // 清空建议墙卡片（保留 empty 和 thinking）
  const wall = document.getElementById('adviceWall');
  wall.querySelectorAll('.advice-card').forEach(c => c.remove());
  // 重新渲染倾诉区
  renderConfessionArea();
  // 立即拉取数据
  poll();
}

// ─── 渲染倾诉区 ───
function renderConfessionArea() {
  const container = document.getElementById('confessionContent');
  const idLabel = myIdentity === 'male' ? '男生' : '女生';
  const idClass = myIdentity;

  let html = `
    <div class="confession-label">
      <span class="lock">🔒</span>
      <span>你的倾诉区 · </span>
      <span class="identity-tag ${idClass}">${idLabel}视角</span>
      <span> · 只有导师能看到</span>
    </div>
    <div class="guide-text">写下你想聊的事、你的感受、你想让对方知道但一直没说的。切换视角可以模拟另一方。</div>
    <div class="option-group">
      <div class="option-group-title">选一个最贴近你情况的：</div>
      <div class="option-list">
        ${SCENE_OPTIONS.map(o => `<div class="option-card ${idClass}" data-scene="${o.value}" onclick="selectScene(this)">${o.label}</div>`).join('')}
      </div>
    </div>
    <textarea class="confess-input ${idClass}" id="confessInput" placeholder="写下具体的事、你的感受、你想让对方知道但一直没说的…" oninput="autoResize(this)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="confess-actions">
      <button class="btn-confess" onclick="submitConfession()">提交倾诉</button>
      <button class="btn-mentor" id="mentorBtn" onclick="askMentor()">请导师回应</button>
    </div>
  `;

  container.innerHTML = html;
}

// ─── 轮询 ───
async function poll() {
  const result = await apiCall('/api/poll', { identity: myIdentity });
  if (result.ok) {
    updateUI(result.state);
  }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(poll, 2000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ─── 更新界面 ───
function updateUI(state) {
  const wall = document.getElementById('adviceWall');
  const empty = document.getElementById('adviceEmpty');
  const thinking = document.getElementById('thinkingCard');

  // 建议墙
  if (state.advices.length > 0) {
    empty.style.display = 'none';
  } else {
    empty.style.display = 'block';
  }

  // 增量添加新建议卡片
  let newAdviceAdded = false;
  state.advices.forEach(advice => {
    if (!renderedAdviceIds.has(advice.id)) {
      const card = document.createElement('div');
      card.className = 'advice-card';
      card.id = 'advice-' + advice.id;
      const time = new Date(advice.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      card.innerHTML = `
        <div class="advice-header">
          <div class="advice-avatar">✨</div>
          <span class="advice-name">情感导师</span>
          <span class="advice-time">${time}</span>
        </div>
        <div class="advice-section">
          <div class="advice-section-label shared">📖 共同解读</div>
          <div class="advice-shared-box">${formatAdvice(advice.sharedPart)}</div>
        </div>
        ${advice.privatePart ? `
        <div class="advice-section">
          <div class="advice-section-label private">🔒 给你的话（仅你可见）</div>
          <div class="advice-private-box">${formatAdvice(advice.privatePart)}</div>
        </div>
        ` : ''}
      `;
      wall.insertBefore(card, thinking);
      renderedAdviceIds.add(advice.id);
      newAdviceAdded = true;
    }
  });

  if (newAdviceAdded) scrollToBottom();

  // 思考动画
  const mentorBtn = document.getElementById('mentorBtn');
  if (mentorBtn) {
    if (state.mentorThinking) {
      thinking.classList.add('show');
      mentorBtn.disabled = true;
      mentorBtn.textContent = '导师思考中…';
      scrollToBottom();
    } else {
      thinking.classList.remove('show');
      mentorBtn.disabled = false;
      mentorBtn.textContent = '请导师回应';
    }
  }

  // 导师错误
  if (state.mentorError) {
    showToast(state.mentorError);
    apiCall('/api/clear-error', {});
  }

  // 我的倾诉历史 - 增量更新
  // 需要重建因为切换视角时内容不同
  const existingList = document.getElementById('myConfessionsList');
  if (existingList) existingList.remove();

  if (state.myConfessions.length > 0) {
    const list = document.createElement('div');
    list.className = 'my-confessions';
    list.id = 'myConfessionsList';
    state.myConfessions.forEach(c => {
      const item = document.createElement('div');
      item.className = 'my-confession-item';
      const time = new Date(c.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      let tagParts = [];
      if (c.sceneType) tagParts.push(c.sceneType);
      if (c.emotion) tagParts.push(c.emotion);
      const tags = tagParts.length > 0 ? `<span class="tags">[${tagParts.join(' · ')}]</span>` : '';
      const text = c.text ? `<span class="text">${escapeHtml(c.text)}</span>` : '<span class="text">（仅选择项）</span>';
      item.innerHTML = `${tags}${text} <span style="float:right">${time}</span>`;
      list.appendChild(item);
    });
    // 插入到 guide-text 前面
    const guideText = document.querySelector('.guide-text');
    if (guideText) {
      guideText.parentNode.insertBefore(list, guideText);
    }
  }

  // 对方状态提示
  const otherLabel = myIdentity === 'male' ? '女生' : '男生';
  let otherStatus = document.getElementById('otherStatus');
  if (!otherStatus) {
    otherStatus = document.createElement('div');
    otherStatus.className = 'other-status';
    otherStatus.id = 'otherStatus';
    const guideText = document.querySelector('.guide-text');
    if (guideText) {
      guideText.parentNode.insertBefore(otherStatus, guideText);
    }
  }
  if (state.otherConfessionCount > 0) {
    otherStatus.innerHTML = `<span class="dot active"></span>${otherLabel}已倾诉 ${state.otherConfessionCount} 次（内容对你不可见）`;
  } else {
    otherStatus.innerHTML = `<span class="dot"></span>${otherLabel}还没有倾诉，你可以先写，导师会先帮你梳理`;
  }
}

// ─── 选择场景 ───
function selectScene(el) {
  document.querySelectorAll('[data-scene]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// ─── 提交倾诉 ───
async function submitConfession() {
  const inputEl = document.getElementById('confessInput');
  const text = inputEl.value.trim();

  const selected = document.querySelector('[data-scene].active');
  const sceneType = selected ? selected.dataset.scene : '';

  if (!sceneType && !text) {
    showToast('请选一个情况，或写点什么');
    return;
  }

  const result = await apiCall('/api/confess', {
    identity: myIdentity,
    sceneType,
    emotion: '',
    text,
  });

  if (result.ok) {
    inputEl.value = '';
    autoResize(inputEl);
    document.querySelectorAll('.option-card.active').forEach(b => b.classList.remove('active'));
    showToast('已提交，导师看到了');
    await poll();
  } else {
    showToast(result.error || '提交失败');
  }
}

// ─── 请导师回应 ───
async function askMentor() {
  const result = await apiCall('/api/ask-mentor', { identity: myIdentity });
  if (result.ok) {
    await poll();
  } else {
    showToast(result.error || '请求失败');
  }
}

// ─── 工具函数 ───
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  const wall = document.getElementById('adviceWall');
  setTimeout(() => { wall.scrollTop = wall.scrollHeight; }, 50);
}

function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function formatAdvice(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ─── 初始化 ───
renderConfessionArea();
startPolling();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopPolling(); }
  else { startPolling(); }
});
</script>

</body>
</html>
